<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICHEKA SHOP - Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Kantumruy Pro", sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .invoice-container {
            max-width: 500px;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .invoice-header {
            background: #2d89ff;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .invoice-header h2 {
            margin: 0;
            font-weight: 700;
        }

        .invoice-body {
            padding: 20px;
        }

        .invoice-body label {
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .highlight {
            background: #eaf4ff;
            padding: 10px;
            border-left: 5px solid #2d89ff;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2d89ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d6fe0;
        }
    </style>
</head>
<body>

<div class="invoice-container">
    <div class="invoice-header">
        <h2>📦 VICHEKA SHOP</h2>
    </div>
    <div class="invoice-body">
        <div class="highlight">ព័ត៌មានវិក័យប័ត្រ</div>

        <label>ថ្ងៃខែឆ្នាំ</label>
        <input type="text" id="date" disabled>

        <label>ឈ្មោះអតិថិជន</label>
        <input type="text" id="name" placeholder="ឈ្មោះ">

        <label>លេខទូរស័ព្ទ</label>
        <input type="text" id="phone" placeholder="0XX XXX XXX">

        <label>ទីតាំង</label>
        <input type="text" id="address" placeholder="លេខផ្ទះ / ខណ្ឌ / ក្រុង">

        <label>ចំនួនទំនិញ</label>
        <input type="number" id="quantity" placeholder="ចំនួន" min="1">

        <label>តម្លៃទំនិញ (រៀល)</label>
        <input type="number" id="price" placeholder="តម្លៃ" min="0">

        <label>ឈ្មោះអ្នកដឹក</label>
        <select id="deliveryName">
            <option value="ផាន់នី">ផាន់នី</option>
            <option value="សុភាព">សុភាព</option>
            <option value="លាងហាក់">លាងហាក់</option>
        </select>

        <label>ស្ថានភាព</label>
        <select id="status">
            <option value="បានដល់គោលដៅហើយ">បានដល់គោលដៅហើយ</option>
        </select>

        <button onclick="sendToTelegram()">📨 ផ្ញើទៅ Telegram</button>
    </div>
</div>

<script>
    // Auto Set Date
    window.onload = function() {
        const today = new Date();
        const formatted = today.getDate().toString().padStart(2,'0') + "/" +
                          (today.getMonth()+1).toString().padStart(2,'0') + "/" +
                          today.getFullYear();
        document.getElementById("date").value = formatted;
    };

    function sendToTelegram() {
        let date = document.getElementById("date").value;
        let name = document.getElementById("name").value;
        let phone = document.getElementById("phone").value;
        let address = document.getElementById("address").value;
        let quantity = document.getElementById("quantity").value;
        let price = document.getElementById("price").value;
        let deliveryName = document.getElementById("deliveryName").value;
        let status = document.getElementById("status").value;

        let message = 
        "📦 *VICHEKA SHOP - Invoice*\n\n" +
        "📅 ថ្ងៃទី: " + date + "\n" +
        "👤 អតិថិជន: " + name + "\n" +
        "📞 លេខ: " + phone + "\n" +
        "📍 ទីតាំង: " + address + "\n" +
        "📦 ចំនួន: " + quantity + "\n" +
        "💰 តម្លៃ: " + price + " ៛\n" +
        "🚚 អ្នកដឹក: " + deliveryName + "\n" +
        "📌 ស្ថានភាព: *" + status + "*";

        let botToken = "8284871141:AAElRWnXk2M5Okkypdo9q7Wu-Q98Kc3swzc"; // បញ្ចូល BOT TOKEN
        let chatId = "1481970507";     // បញ្ចូល CHAT ID

        let url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

        fetch(url)
            .then(response => alert("✔​ បានផ្ញើរួចរាល់!"))
            .catch(error => alert("❌ មិនអាចផ្ញើបាន!"));
    }
</script>

</body>
</html>
